<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb Conference 2026</title>
</head>
<body>
    <header id="topo">
      <h1>DevWeb Conference 2026 - Login</h1>

      <p>
        Um encontro sobre desenvolvimento web, interfaces e experiências
        digitais.
      </p>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>
                <p>
                    <label for="nome">Nome:</label>
                    
                    <input type="text" id="nome" name="nome" required />
                </p>
                
                <p>
                    <label for="email">E-mail:</label>
                    
                    <input type="email" id="email" name="email" required />
                </p>
                
                <p>
                    <label for="senha">Crie uma senha:</label>
                    
                    <input type="password" id="senha" name="senha" required />
                </p>
            
                <p>
                    <input type="checkbox" id="novidades" name="novidades" />
                    
                    <label for="novidades">
                        Desejo receber novidades sobre o evento
                    </label>
                </p>
                <p>
                <button type="submit">Realizar inscrição</button>
                </p>
                <a href="index.html">Voltar para o evento</a>
            </fieldset>
            </form>
    </main>
</body>
</html>
